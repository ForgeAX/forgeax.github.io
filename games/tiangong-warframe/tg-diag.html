<script>/* 启动诊断（[win] 10-24）：Windows 打不开的排查用。由 scripts/startup-diag/inject.mjs 内联进 index.html，并生成独立页 tg-diag.html。

      if (c.pct) p('   单条耗时 p50/p95/max: ' + c.pct.join(' / ') + ' ms');
      (c.slowest || []).forEach(function (s) { p('   慢: ' + s); });
      (c.shaderErrors || []).forEach(function (s) { p('   着色器: ' + s); });
      (c.failures || []).forEach(function (s) { p('   失败: ' + s); });
      if (c.error) p('   错误: ' + c.error);
    }
    p('\n== 启动时间线');
    (R.timeline || []).forEach(function (e) { p('  ' + e.t + 'ms ' + e.kind + ' ' + e.text); });
    if (R.pageErrors && R.pageErrors.length) { p('\n== 页面错误'); R.pageErrors.forEach(function (s) { p('  ' + s); }); }
    if (R.consoleErrors && R.consoleErrors.length) { p('\n== console.error / warn（主线程）'); R.consoleErrors.forEach(function (s) { p('  ' + s); }); }
    p('\n== 网络: ' + JSON.stringify(R.network || {}));
    p('== ServiceWorker: ' + JSON.stringify(R.serviceWorker || {}));
    p('== 管线库需要: ' + JSON.stringify(R.libraryNeeds));
    return L.join('\n');
  }

  // ---------- 管线库编译测试（只在 tg-diag.html 里点按钮时跑） ----------
  async function compileTest(url, onProgress) {
    var C = { library: url, state: 'loading', total: 0, ok: 0, failed: 0, ms: 0, moduleMs: 0, failures: [], shaderErrors: [] };
    try {
      var m = await (await fetch(url)).json();
      var a = await navigator.gpu.requestAdapter();
      var desc = engineDeviceDescriptor(a);
      var dev = await a.requestDevice(desc);
      var lost = null; dev.lost.then(function (i) { lost = i.reason + ' ' + i.message; });
      var uncaptured = [];
      dev.onuncapturederror = function (e) { if (uncaptured.length < 20) uncaptured.push(cut(e.error && e.error.message, 600)); };
      var tM = performance.now();
      var shaders = m.shaders.map(function (s) { return dev.createShaderModule({ code: s.code }); });
      var infos = await Promise.all(shaders.map(function (s) { return s.getCompilationInfo ? s.getCompilationInfo().catch(function () { return null; }) : null; }));
      infos.forEach(function (inf, i) { if (inf) inf.messages.forEach(function (msg) { if (msg.type === 'error' && C.shaderErrors.length < 10) C.shaderErrors.push('#' + i + ' ' + msg.lineNum + ':' + msg.linePos + ' ' + cut(msg.message, 300)); }); });
      C.moduleMs = Math.round(performance.now() - tM);
      dev.pushErrorScope('validation');
      var groups = m.bindGroupLayouts.map(function (x) { return dev.createBindGroupLayout(x); });
      var layouts = m.pipelineLayouts.map(function (ids) { return dev.createPipelineLayout({ bindGroupLayouts: ids.map(function (i) { return groups[i]; }) }); });
      var layErr = await dev.popErrorScope();
      if (layErr) C.failures.push('bind group / pipeline layout: ' + cut(layErr.message, 600));
      var lay = function (l) { return l === 'auto' ? 'auto' : layouts[l]; };
      var reqs = [];
      m.renderPipelines.forEach(function (p) { reqs.push({ label: p.label, run: function () { var d = Object.assign({}, p, { layout: lay(p.layout), vertex: Object.assign({}, p.vertex, { module: shaders[p.vertex.module] }) }); if (p.fragment) d.fragment = Object.assign({}, p.fragment, { module: shaders[p.fragment.module] }); return dev.createRenderPipelineAsync(d); } }); });
      m.computePipelines.forEach(function (p) { reqs.push({ label: p.label, run: function () { return dev.createComputePipelineAsync(Object.assign({}, p, { layout: lay(p.layout), compute: Object.assign({}, p.compute, { module: shaders[p.compute.module] }) })); } }); });
      C.total = reqs.length; C.state = 'compiling';
      var times = [], cursor = 0, t1 = performance.now();
      await Promise.all([0, 1, 2, 3].map(async function () {
        while (cursor < reqs.length && !lost) {
          var r = reqs[cursor++], s = performance.now();
          try { await r.run(); C.ok++; } catch (e) { C.failed++; if (C.failures.length < 15) C.failures.push(cut(r.label, 120) + ' → ' + cut(errText(e), 600)); }
          times.push([performance.now() - s, r.label]);
          if (onProgress && (C.ok + C.failed) % 10 === 0) onProgress(C, Math.round(performance.now() - t1));
        }
      }));
      C.ms = Math.round(performance.now() - t1);
      times.sort(function (x, y) { return x[0] - y[0]; });
      var at = function (q) { return times.length ? Math.round(times[Math.min(times.length - 1, Math.floor(q * times.length))][0]) : 0; };
      C.pct = [at(0.5), at(0.95), at(1)];
      C.slowest = times.slice(-5).reverse().map(function (x) { return Math.round(x[0]) + 'ms ' + cut(x[1], 100); });
      if (uncaptured.length) C.failures = C.failures.concat(uncaptured.map(function (s) { return 'uncaptured: ' + s; }));
      C.state = lost ? 'DEVICE LOST: ' + lost : 'done';
      try { dev.destroy(); } catch (e) { /* 忽略 */ }
    } catch (e) { C.state = 'error'; C.error = errText(e); }
    return C;
  }

  // ---------- 面板 ----------
  var panel = null;
  function showPanel(text, extra) {
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'tg-diag-panel';
      panel.setAttribute('style', 'position:fixed;inset:4vh 4vw;z-index:2147483647;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px;display:flex;flex-direction:column;text-align:left;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;box-shadow:0 8px 40px #000a');
      panel.innerHTML = '<div style="display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #30363d;font:14px system-ui,sans-serif"><b style="flex:1">启动诊断 / Startup diagnostics</b>' +
        '<button data-a="copy" style="padding:6px 14px;font-size:14px;cursor:pointer">复制全部 Copy</button>' +
        '<a data-a="deep" target="_blank" style="color:#58a6ff">完整 GPU 测试 →</a>' +
        '<button data-a="close" style="padding:6px 10px;cursor:pointer">✕</button></div>' +
        '<div style="padding:6px 12px;color:#8b949e;font:13px system-ui,sans-serif">请点「复制全部」把内容发回给开发者（也可截图）。Click “Copy” and send the text back.</div>' +
        '<pre style="flex:1;overflow:auto;margin:0;padding:10px 12px;white-space:pre-wrap;word-break:break-all;user-select:text"></pre>';
      panel.querySelector('[data-a=close]').onclick = function () { panel.style.display = 'none'; };
      panel.querySelector('[data-a=deep]').href = new URL('tg-diag.html', location.href).href;
      panel.querySelector('[data-a=copy]').onclick = function (ev2) {
        var txt = panel.querySelector('pre').textContent, btn = ev2.currentTarget;
        var done = function (ok) { btn.textContent = ok ? '已复制 Copied ✓' : '复制失败，请手动全选'; };
        var fallback = function () { try { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove(); done(ok); } catch (e) { done(false); } };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { done(true); }, fallback); else fallback();
      };
      if (extra) extra(panel);
    }
    // 启动期间引擎在 window 捕获阶段拦掉一切不在加载层 / 失败层里的点击，所以面板挂在当前可见的那一层里
    var vis = function (id) { var n = document.getElementById(id); return n && getComputedStyle(n).display !== 'none' ? n : null; };
    var host = vis('forgeax-fatal') || vis('forgeax-loading') || document.body || document.documentElement;
    if (panel.parentNode !== host) host.appendChild(panel);
    panel.style.display = 'flex';
    panel.querySelector('pre').textContent = text;
    return panel;
  }
  var opening = false;
  async function open(full) {
    if (opening) return; opening = true;
    try { showPanel('收集中… / collecting…'); var R = await collect(full); g.__tgDiagLast = R; showPanel(toText(R)); }
    catch (e) { showPanel('诊断本身出错: ' + errText(e)); }
    finally { opening = false; }
  }
  g.__tgDiag = { collect: collect, toText: toText, verdict: verdict, open: open, compileTest: compileTest, showPanel: showPanel, data: D, req: REQ };

  // ---------- 游戏页挂钩 ----------
  function hookGamePage() {
    var st = document.getElementById('forgeax-loading-status');
    var fatal = document.getElementById('forgeax-fatal');
    if (!st && !fatal) return false;
    var lastText = '';
    var check = function () {
      if (st && st.textContent !== lastText) { lastText = st.textContent; ev('status', lastText); }
      if (fatal && getComputedStyle(fatal).display !== 'none' && !D.fatalText) {
        var fd = document.getElementById('forgeax-fatal-details');
        D.fatalText = fd ? fd.textContent || '(empty)' : '(no details)';
        ev('fatal', D.fatalText);
        open(true);
      }
    };
    var mo = new MutationObserver(check);
    [st, fatal, document.getElementById('forgeax-fatal-details'), document.getElementById('forgeax-loading')].forEach(function (n) { if (n) mo.observe(n, { attributes: true, childList: true, characterData: true, subtree: true }); });
    check();
    // 加载中右下角小按钮（首帧后自动隐藏）；?tgdiag 直接打开
    var btn = document.createElement('button');
    btn.textContent = '诊断 Diagnostics';
    btn.setAttribute('style', 'position:fixed;right:12px;bottom:12px;z-index:2147483646;padding:6px 12px;font:13px system-ui,sans-serif;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;cursor:pointer;opacity:.85');
    btn.onclick = function (e) { e.stopPropagation(); open(true); };
    (document.getElementById('forgeax-loading') || document.body).appendChild(btn);
    var hideBtn = function () { if (D.firstFrameMs !== null && !/[?&]tgdiag/.test(location.search)) btn.style.display = 'none'; else setTimeout(hideBtn, 1000); };
    hideBtn();
    if (/[?&](tgdiag|forgeax-diag)/.test(location.search)) setTimeout(function () { open(true); }, 1500);
    // [win2] 开局先看一眼适配器：Windows 双显卡笔记本上 Chrome 默认跑集成显卡（10-24 实机：lock 的 Chrome 在 Iris Xe 上，开游戏整机卡死），给出明确提示
    try {
      if (navigator.gpu) navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }).then(function (a) {
        var i = (a && a.info) || {}, s = [i.vendor, i.architecture, i.description].join(' ').trim();
        ev('adapter', s || (a ? '(no info)' : 'null'));
        if (!a || !isIgpu(s) || /[?&]igpu=ok/.test(location.search)) return;
        var b = document.createElement('div');
        b.id = 'tg-igpu-warning';
        b.setAttribute('style', 'position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:2147483646;max-width:min(760px,92vw);padding:12px 40px 12px 16px;background:#3d2a00;color:#ffe9b0;border:1px solid #d29922;border-radius:8px;font:14px/1.5 system-ui,sans-serif;box-shadow:0 6px 30px #000a');
        b.innerHTML = '<b>Chrome 正在用集成显卡（' + s.replace(/[<>&]/g, '') + '）</b><br>游戏会很卡，还可能把内存吃光导致整机卡死。如果电脑有独立显卡：Windows 设置 → 系统 → 屏幕 → 显示卡，把 Google Chrome 设为「高性能」，然后完全退出 Chrome 再打开。' +
          '<br><span style="opacity:.8">Chrome is running on the integrated GPU. Set Google Chrome to “High performance” in Windows Settings → System → Display → Graphics, then fully restart Chrome.</span>' +
          '<br>没有独立显卡：设置 →「渲染缩放」调到 70–80% 可以减轻显卡负担。<span style="opacity:.8"> No discrete GPU: lower Settings → Render scale to 70–80%. / 専用 GPU がない場合：設定 →「レンダースケール」を 70–80% に下げてください。</span>' + /* [overlap] 档位不再固定降分辨率 */
          '<button style="position:absolute;right:8px;top:8px;background:none;border:0;color:inherit;font-size:16px;cursor:pointer" aria-label="close">✕</button>';
        b.querySelector('button').onclick = function (e) { e.stopPropagation(); b.remove(); };
        document.body.appendChild(b);
      }, function () { /* 忽略 */ });
    } catch (e) { /* 忽略 */ }
    return true;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hookGamePage); else hookGamePage();
  ev('diag-installed', '');
})();
</script></head>
<body><main>
<h2>天工战甲 · GPU 诊断（不会启动游戏）</h2>
<p>① 页面打开后自动检查显卡能力。② 点「完整编译测试」会把游戏启动时要编的着色器管线全部编一遍（首次可能要 1–3 分钟，期间浏览器会比较卡），能直接看出 Windows 上哪一条编不过、总共要多久。③ 点「复制全部」把结果发回来。</p>
<div id="bar"><button id="copy">复制全部 Copy</button><button id="run">完整编译测试（主菜单档）</button><select id="lib"><option value="tg-diag/pipeline-library-menu.json">pipeline-library-menu.json</option><option value="tg-diag/pipeline-library.json">pipeline-library.json</option></select><span id="prog"></span></div>
<pre id="out">检查中…</pre>
<script>
(async function () {
  var D = window.__tgDiag, out = document.getElementById('out'), prog = document.getElementById('prog'), R = null;
  var render = function () { out.textContent = D.toText(R); };
  try { R = await D.collect(true); render(); } catch (e) { out.textContent = '诊断出错: ' + (e && e.stack || e); }
  document.getElementById('copy').onclick = function (e) {
    var b = e.currentTarget, t = out.textContent;
    var fb = function () { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove(); b.textContent = ok ? '已复制 ✓' : '复制失败，请手动全选'; };
    navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t).then(function () { b.textContent = '已复制 ✓'; }, fb) : fb();
  };
  document.getElementById('run').onclick = async function (e) {
    var b = e.currentTarget; b.disabled = true; prog.textContent = ' 编译中…';
    var lib = document.getElementById('lib').value;
    R = R || {}; R.compile = await D.compileTest(lib, function (c, ms) { prog.textContent = ' ' + (c.ok + c.failed) + '/' + c.total + '  ' + Math.round(ms / 1000) + ' s' + (c.failed ? '  失败 ' + c.failed : ''); });
    prog.textContent = ' 完成'; b.disabled = false; render();
  };
  if (/[?&]run/.test(location.search)) document.getElementById('run').click();
})();
</script></main></body></html>
