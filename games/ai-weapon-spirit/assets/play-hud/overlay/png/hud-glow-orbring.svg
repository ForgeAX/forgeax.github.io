<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
  <!-- ===== frost body of the rim band ===== -->
  <radialGradient id="rimFrost" gradientUnits="userSpaceOnUse" cx="64" cy="64" r="58">
    <stop offset="0.66" stop-color="#1a4d38" stop-opacity="0.50"/>
    <stop offset="0.78" stop-color="#1a4d38" stop-opacity="0.60"/>
    <stop offset="0.90" stop-color="#0d2f22" stop-opacity="0.62"/>
    <stop offset="1" stop-color="#03120c" stop-opacity="0.62"/>
  </radialGradient>

  <!-- warm light from above, laid on the band -->
  <linearGradient id="rimTopLight" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="66">
    <stop offset="0%" stop-color="#e8c888" stop-opacity="0.20"/>
    <stop offset="55%" stop-color="#e8c888" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#e8c888" stop-opacity="0"/>
  </linearGradient>

  <!-- faint gold anchor glow at the bottom of the band -->
  <radialGradient id="anchorGlow" gradientUnits="userSpaceOnUse" cx="64" cy="120" r="30">
    <stop offset="0%" stop-color="#c8a868" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#c8a868" stop-opacity="0"/>
  </radialGradient>

  <!-- inner shadow so the liquid sits inside the ring -->
  <radialGradient id="innerShade" gradientUnits="userSpaceOnUse" cx="64" cy="64" r="58">
    <stop offset="0.735" stop-color="#01100a" stop-opacity="0"/>
    <stop offset="0.776" stop-color="#01100a" stop-opacity="0.35"/>
    <stop offset="0.812" stop-color="#01100a" stop-opacity="0.16"/>
    <stop offset="0.845" stop-color="#01100a" stop-opacity="0"/>
  </radialGradient>

  <!-- outer gold hairline: bright on top, faded at the bottom -->
  <linearGradient id="goldRing" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="122">
    <stop offset="0%" stop-color="#e8c888" stop-opacity="0.92"/>
    <stop offset="22%" stop-color="#d4b878" stop-opacity="0.78"/>
    <stop offset="60%" stop-color="#d4b878" stop-opacity="0.52"/>
    <stop offset="100%" stop-color="#d4b878" stop-opacity="0.35"/>
  </linearGradient>
  <linearGradient id="jadeRing" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="113">
    <stop offset="0%" stop-color="#2f7a5c" stop-opacity="0.60"/>
    <stop offset="55%" stop-color="#2f7a5c" stop-opacity="0.44"/>
    <stop offset="100%" stop-color="#2f7a5c" stop-opacity="0.26"/>
  </linearGradient>

  <linearGradient id="topFadeW" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="62">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="45%" stop-color="#fff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>

  <filter id="fFeather" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.15"/></filter>
  <filter id="fGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.0"/></filter>
  <filter id="fHalo" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="fHalo2" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="fSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="0.7"/></filter>

  <!-- keeps the orb centre perfectly clear and everything inside r<=63 -->
  <clipPath id="cBand" clipPathUnits="userSpaceOnUse">
    <path fill-rule="evenodd" d="M1,64 A63,63 0 1,0 127,64 A63,63 0 1,0 1,64 Z M19,64 A45,45 0 1,0 109,64 A45,45 0 1,0 19,64 Z"/>
  </clipPath>
  <clipPath id="cAll" clipPathUnits="userSpaceOnUse">
    <circle cx="64" cy="64" r="63"/>
  </clipPath>

  <mask id="mTop" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
    <rect x="0" y="0" width="128" height="62" fill="url(#topFadeW)"/>
  </mask>
</defs>

<g clip-path="url(#cAll)">

  <!-- ===== translucent jade frost band, feathered outer edge ===== -->
  <g clip-path="url(#cBand)">
    <path fill-rule="evenodd" filter="url(#fFeather)" fill="url(#rimFrost)"
          d="M6,64 A58,58 0 1,0 122,64 A58,58 0 1,0 6,64 Z M22,64 A42,42 0 1,0 106,64 A42,42 0 1,0 22,64 Z"/>
    <!-- warm light band along the top of the ring -->
    <circle cx="64" cy="64" r="58" fill="url(#rimTopLight)"/>
    <!-- gold anchor glow at the bottom -->
    <circle cx="64" cy="64" r="58" fill="url(#anchorGlow)"/>
    <!-- inner shadow onto the liquid -->
    <circle cx="64" cy="64" r="52" fill="url(#innerShade)"/>
  </g>

  <!-- ===== soft warm glow arc outside the top of the ring ===== -->
  <g mask="url(#mTop)">
    <circle cx="64" cy="64" r="60" fill="none" stroke="#e8c888" stroke-width="4" opacity="0.18" filter="url(#fGlow)"/>
    <circle cx="64" cy="64" r="58.6" fill="none" stroke="#e8c888" stroke-width="1.4" opacity="0.14" filter="url(#fSoft)"/>
  </g>

  <!-- ===== hairlines ===== -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#goldRing)" stroke-width="1"/>
  <circle cx="64" cy="64" r="48.5" fill="none" stroke="url(#jadeRing)" stroke-width="0.7"/>

  <!-- ===== 菱花 at 12 o'clock ===== -->
  <g transform="translate(64,6.6)">
    <polygon points="0,-9.5 9.5,0 0,9.5 -9.5,0" fill="#e8c888" opacity="0.13" filter="url(#fHalo2)"/>
    <polygon points="0,-5.5 5.5,0 0,5.5 -5.5,0" fill="#f3e8d0" opacity="0.26" filter="url(#fHalo)"/>
    <polygon points="0,-5.5 5.5,0 0,5.5 -5.5,0" fill="#e8c888" stroke="#b89858" stroke-width="0.4"/>
    <polygon points="0,-2 2,0 0,2 -2,0" fill="#fff8e8"/>
  </g>

  <!-- ===== hollow rhombus at 6 o'clock ===== -->
  <g transform="translate(64,122)">
    <polygon points="0,-3 3,0 0,3 -3,0" fill="#e8c888" opacity="0.16" filter="url(#fHalo)"/>
    <polygon points="0,-3 3,0 0,3 -3,0" fill="none" stroke="#d4b878" stroke-width="0.7" opacity="0.7"/>
  </g>

  <!-- ===== tiny rhombi at 3 / 9 o'clock, on the band ===== -->
  <g transform="translate(117,64)">
    <polygon points="0,-2.2 2.2,0 0,2.2 -2.2,0" fill="#f3e8d0" opacity="0.22" filter="url(#fHalo)"/>
    <polygon points="0,-2.2 2.2,0 0,2.2 -2.2,0" fill="#e8c888" stroke="#b89858" stroke-width="0.3" opacity="0.85"/>
    <polygon points="0,-0.8 0.8,0 0,0.8 -0.8,0" fill="#fff8e8" opacity="0.9"/>
  </g>
  <g transform="translate(11,64)">
    <polygon points="0,-2.2 2.2,0 0,2.2 -2.2,0" fill="#f3e8d0" opacity="0.22" filter="url(#fHalo)"/>
    <polygon points="0,-2.2 2.2,0 0,2.2 -2.2,0" fill="#e8c888" stroke="#b89858" stroke-width="0.3" opacity="0.85"/>
    <polygon points="0,-0.8 0.8,0 0,0.8 -0.8,0" fill="#fff8e8" opacity="0.9"/>
  </g>

  <!-- ===== 4-point stars just outside the gold ring, on the diagonals ===== -->
  <g fill="#d4b878" opacity="0.6">
    <path transform="translate(106.8,21.2)" d="M0,-1.6 C0.25,-0.5 0.5,-0.25 1.6,0 C0.5,0.25 0.25,0.5 0,1.6 C-0.25,0.5 -0.5,0.25 -1.6,0 C-0.5,-0.25 -0.25,-0.5 0,-1.6 Z"/>
    <path transform="translate(21.2,21.2)" d="M0,-1.6 C0.25,-0.5 0.5,-0.25 1.6,0 C0.5,0.25 0.25,0.5 0,1.6 C-0.25,0.5 -0.5,0.25 -1.6,0 C-0.5,-0.25 -0.25,-0.5 0,-1.6 Z"/>
    <path transform="translate(106.8,106.8)" d="M0,-1.6 C0.25,-0.5 0.5,-0.25 1.6,0 C0.5,0.25 0.25,0.5 0,1.6 C-0.25,0.5 -0.5,0.25 -1.6,0 C-0.5,-0.25 -0.25,-0.5 0,-1.6 Z"/>
    <path transform="translate(21.2,106.8)" d="M0,-1.6 C0.25,-0.5 0.5,-0.25 1.6,0 C0.5,0.25 0.25,0.5 0,1.6 C-0.25,0.5 -0.5,0.25 -1.6,0 C-0.5,-0.25 -0.25,-0.5 0,-1.6 Z"/>
  </g>
  <g fill="#e8c888" opacity="0.22" filter="url(#fHalo)">
    <path transform="translate(106.8,21.2)" d="M0,-1.6 C0.25,-0.5 0.5,-0.25 1.6,0 C0.5,0.25 0.25,0.5 0,1.6 C-0.25,0.5 -0.5,0.25 -1.6,0 C-0.5,-0.25 -0.25,-0.5 0,-1.6 Z"/>
    <path transform="translate(21.2,21.2)" d="M0,-1.6 C0.25,-0.5 0.5,-0.25 1.6,0 C0.5,0.25 0.25,0.5 0,1.6 C-0.25,0.5 -0.5,0.25 -1.6,0 C-0.5,-0.25 -0.25,-0.5 0,-1.6 Z"/>
    <path transform="translate(106.8,106.8)" d="M0,-1.6 C0.25,-0.5 0.5,-0.25 1.6,0 C0.5,0.25 0.25,0.5 0,1.6 C-0.25,0.5 -0.5,0.25 -1.6,0 C-0.5,-0.25 -0.25,-0.5 0,-1.6 Z"/>
    <path transform="translate(21.2,106.8)" d="M0,-1.6 C0.25,-0.5 0.5,-0.25 1.6,0 C0.5,0.25 0.25,0.5 0,1.6 C-0.25,0.5 -0.5,0.25 -1.6,0 C-0.5,-0.25 -0.25,-0.5 0,-1.6 Z"/>
  </g>

</g>
</svg>