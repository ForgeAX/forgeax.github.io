<svg xmlns="http://www.w3.org/2000/svg" width="220" height="12" viewBox="0 0 220 12" preserveAspectRatio="none">
  <defs>
    <linearGradient id="goldFade" gradientUnits="userSpaceOnUse" x1="15" y1="0" x2="210" y2="0">
      <stop offset="0%" stop-color="#d4b878" stop-opacity="0.92"/>
      <stop offset="12%" stop-color="#e8c888" stop-opacity="0.80"/>
      <stop offset="42%" stop-color="#d4b878" stop-opacity="0.55"/>
      <stop offset="72%" stop-color="#d4b878" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4b878" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGlowFade" gradientUnits="userSpaceOnUse" x1="15" y1="0" x2="200" y2="0">
      <stop offset="0%" stop-color="#e8c888" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#e8c888" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e8c888" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="jadeFade" gradientUnits="userSpaceOnUse" x1="15" y1="0" x2="150" y2="0">
      <stop offset="0%" stop-color="#2f7a5c" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#2f7a5c" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2f7a5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frostWash" gradientUnits="userSpaceOnUse" x1="15" y1="0" x2="130" y2="0">
      <stop offset="0%" stop-color="#1a4d38" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#0d2f22" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#03120c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="anchorGlow" gradientUnits="userSpaceOnUse" cx="8" cy="6" r="16">
      <stop offset="0%" stop-color="#e8d4a8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8d4a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="dBlurSoft" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="1.1 0.9"/>
    </filter>
    <filter id="dBlurLine" x="-20%" y="-600%" width="140%" height="1300%">
      <feGaussianBlur stdDeviation="0.6 0.8"/>
    </filter>
    <filter id="dBlurTiny" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="dFeather" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.6 1.2"/>
    </filter>
  </defs>

  <ellipse cx="9" cy="6" rx="15" ry="5.2" fill="url(#anchorGlow)"/>
  <rect x="15" y="2.6" width="115" height="6.6" fill="url(#frostWash)" filter="url(#dFeather)" opacity="0.55"/>

  <rect x="15" y="4.55" width="195" height="1.9" fill="url(#goldGlowFade)" filter="url(#dBlurSoft)" opacity="0.4"/>
  <rect x="15" y="4.75" width="195" height="0.9" fill="url(#goldFade)" filter="url(#dBlurLine)" opacity="0.35"/>
  <rect x="15" y="4.75" width="195" height="0.9" fill="url(#goldFade)"/>

  <rect x="15" y="7.1" width="135" height="0.6" fill="url(#jadeFade)" filter="url(#dBlurLine)" opacity="0.4"/>
  <rect x="15" y="7.1" width="135" height="0.6" fill="url(#jadeFade)"/>

  <g transform="translate(96,5.2)">
    <path d="M0,-2.4 Q0.26,-0.26 2.4,0 Q0.26,0.26 0,2.4 Q-0.26,0.26 -2.4,0 Q-0.26,-0.26 0,-2.4 Z" fill="#e8c888" opacity="0.28" filter="url(#dBlurTiny)"/>
    <path d="M0,-1.7 Q0.2,-0.2 1.9,0 Q0.2,0.2 0,1.7 Q-0.2,0.2 -1.9,0 Q-0.2,-0.2 0,-1.7 Z" fill="#d4b878" opacity="0.8"/>
  </g>

  <g transform="translate(8,6)">
    <polygon points="0,-4.6 4.6,0 0,4.6 -4.6,0" fill="#f3e8d0" opacity="0.18" filter="url(#dBlurTiny)"/>
    <polygon points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="#f3e8d0" opacity="0.22" filter="url(#dBlurTiny)"/>
    <polygon points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="#e8c888" stroke="#b89858" stroke-width="0.25"/>
    <polygon points="0,-1.3 1.3,0 0,1.3 -1.3,0" fill="#fff8e8"/>
  </g>
</svg>