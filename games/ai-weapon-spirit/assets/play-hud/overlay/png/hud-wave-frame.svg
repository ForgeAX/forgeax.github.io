<svg xmlns="http://www.w3.org/2000/svg" width="120" height="36" viewBox="0 0 120 36">
  <defs>
    <linearGradient id="frostGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4d38" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#0d2f22" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#03120c" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="topLightBandGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c888" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#e8c888" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomAnchorGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8a868" stop-opacity="0"/>
      <stop offset="83.33%" stop-color="#c8a868" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8a868" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeFeatherMask">
      <rect x="1.8" y="1.8" width="116.4" height="32.4" fill="white" filter="url(#blurMask)"/>
    </mask>
    <filter id="blurMask" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3"/>
    </filter>
    <filter id="cornerBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3"/>
    </filter>
  </defs>
  <g mask="url(#edgeFeatherMask)">
    <!-- Frost plate pieces -->
    <rect x="0" y="0" width="36" height="36" fill="url(#frostGradient)"/>
    <rect x="36" y="0" width="48" height="36" fill="url(#frostGradient)"/>
    <rect x="84" y="0" width="36" height="36" fill="url(#frostGradient)"/>
    
    <!-- Top light band -->
    <rect x="0" y="0" width="120" height="6" fill="url(#topLightBandGradient)"/>
    <rect x="0" y="0" width="120" height="6" fill="url(#topLightBandGradient)" opacity="0.16" filter="url(#blurMask)"/>
    
    <!-- Bottom anchor -->
    <rect x="0" y="30" width="120" height="6" fill="url(#bottomAnchorGradient)"/>
    
    <!-- Corner marks -->
    <g id="cornerMarks">
      <polygon points="3,0 6,3 3,6 0,3" fill="#d4b878" opacity="0.5"/>
      <polygon points="3,0 6,3 3,6 0,3" fill="#d4b878" opacity="0.16" filter="url(#cornerBlur)"/>
      <polygon points="117,0 114,3 117,6 120,3" fill="#d4b878" opacity="0.5"/>
      <polygon points="117,0 114,3 117,6 120,3" fill="#d4b878" opacity="0.16" filter="url(#cornerBlur)"/>
      <polygon points="3,36 6,33 3,30 0,33" fill="#d4b878" opacity="0.5"/>
      <polygon points="3,36 6,33 3,30 0,33" fill="#d4b878" opacity="0.16" filter="url(#cornerBlur)"/>
      <polygon points="117,36 114,33 117,30 120,33" fill="#d4b878" opacity="0.5"/>
      <polygon points="117,36 114,33 117,30 120,33" fill="#d4b878" opacity="0.16" filter="url(#cornerBlur)"/>
    </g>
    
    <!-- 菱花 jewels -->
    <g id="jewels">
      <!-- Left cap -->
      <g transform="translate(12,18)">
        <circle r="4" fill="#f3e8d0" opacity="0.2" filter="url(#blurMask)"/>
        <polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" fill="#e8c888" stroke="#b89858" stroke-width="0.2"/>
        <polygon points="0,-1 1,0 0,1 -1,0" fill="#fff8e8"/>
      </g>
      <g transform="translate(30,18)" opacity="0.7">
        <circle r="2" fill="#f3e8d0" opacity="0.2" filter="url(#blurMask)"/>
        <polygon points="0,-2 0.5,-0.5 2,0 0.5,0.5 0,2 -0.5,0.5 -2,0 -0.5,-0.5" fill="#e8c888" stroke="#b89858" stroke-width="0.2"/>
        <polygon points="0,-0.5 0.5,0 0,0.5 -0.5,0" fill="#fff8e8"/>
      </g>
      
      <!-- Right cap -->
      <g transform="translate(108,18)">
        <circle r="4" fill="#f3e8d0" opacity="0.2" filter="url(#blurMask)"/>
        <polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" fill="#e8c888" stroke="#b89858" stroke-width="0.2"/>
        <polygon points="0,-1 1,0 0,1 -1,0" fill="#fff8e8"/>
      </g>
      <g transform="translate(90,18)" opacity="0.7">
        <circle r="2" fill="#f3e8d0" opacity="0.2" filter="url(#blurMask)"/>
        <polygon points="0,-2 0.5,-0.5 2,0 0.5,0.5 0,2 -0.5,0.5 -2,0 -0.5,-0.5" fill="#e8c888" stroke="#b89858" stroke-width="0.2"/>
        <polygon points="0,-0.5 0.5,0 0,0.5 -0.5,0" fill="#fff8e8"/>
      </g>
    </g>
  </g>
</svg>
