<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="frost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4d38" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#0d2f22" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#03120c" stop-opacity="0.66"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#e8d4a8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e8d4a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bandVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c888" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#e8c888" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bandHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="black" stop-opacity="0"/>
      <stop offset="50%" stop-color="black" stop-opacity="1"/>
      <stop offset="100%" stop-color="black" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="anchorVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8a868" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8a868" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="0 1.0"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  <filter id="featherB" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.3"/></filter><mask id="feather" maskUnits="userSpaceOnUse" x="0" y="0" width="36" height="36"><rect x="1.8" y="1.8" width="32.4" height="32.4" fill="#fff" filter="url(#featherB)"/></mask></defs><g mask="url(#feather)">
  <rect width="36" height="36" fill="url(#frost)"/>
  <rect width="36" height="36" fill="url(#glow)"/>
  <rect width="36" height="6" fill="url(#bandVert)" mask="url(#bandMask)"/>
  <rect width="36" height="6" fill="url(#bandVert)" mask="url(#bandMask)" filter="url(#blur1)" opacity="0.16"/>
  <rect x="0" y="33" width="36" height="3" fill="url(#anchorVert)" mask="url(#anchorMask)"/>
  <g transform="translate(3,3)">
    <polygon points="0,-1.5 1.5,0 0,1.5 -1.5,0" fill="#d4b878" opacity="0.5"/>
    <polygon points="0,-1.5 1.5,0 0,1.5 -1.5,0" fill="#d4b878" opacity="0.16" filter="url(#blur1)"/>
  </g>
  <g transform="translate(3,33)">
    <polygon points="0,-1.5 1.5,0 0,1.5 -1.5,0" fill="#d4b878" opacity="0.5"/>
    <polygon points="0,-1.5 1.5,0 0,1.5 -1.5,0" fill="#d4b878" opacity="0.16" filter="url(#blur1)"/>
  </g>
  <g transform="translate(33,3)">
    <polygon points="0,-1.5 1.5,0 0,1.5 -1.5,0" fill="#d4b878" opacity="0.5"/>
    <polygon points="0,-1.5 1.5,0 0,1.5 -1.5,0" fill="#d4b878" opacity="0.16" filter="url(#blur1)"/>
  </g>
  <g transform="translate(33,33)">
    <polygon points="0,-1.5 1.5,0 0,1.5 -1.5,0" fill="#d4b878" opacity="0.5"/>
    <polygon points="0,-1.5 1.5,0 0,1.5 -1.5,0" fill="#d4b878" opacity="0.16" filter="url(#blur1)"/>
  </g>
  <mask id="bandMask">
