<svg width="256" height="64" viewBox="0 0 256 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="jg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f7a5c" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#2f7a5c" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#06201b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c888" stop-opacity=".30"/>
      <stop offset="70%" stop-color="#b89858" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#b89858" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c888"/>
      <stop offset="55%" stop-color="#d4b878"/>
      <stop offset="100%" stop-color="#b89858"/>
    </linearGradient>
    <linearGradient id="gemA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fe0d2"/>
      <stop offset="100%" stop-color="#2f7a5c"/>
    </linearGradient>
    <linearGradient id="gemB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fe0d2" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#123f36"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff8e8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- shared backdrops -->
  <g>
    <circle cx="32" cy="32" r="26" fill="url(#jg)"/><circle cx="32" cy="32" r="22" fill="url(#gh)"/>
    <circle cx="96" cy="32" r="26" fill="url(#jg)"/><circle cx="96" cy="32" r="22" fill="url(#gh)"/>
    <circle cx="160" cy="32" r="26" fill="url(#jg)"/><circle cx="160" cy="32" r="22" fill="url(#gh)"/>
    <circle cx="224" cy="32" r="26" fill="url(#jg)"/><circle cx="224" cy="32" r="22" fill="url(#gh)"/>
  </g>

  <!-- CELL 0: rank-up chevrons over a qi swirl -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#soft)" opacity=".55"><path d="M21 30l11-10 11 10" stroke="#9fe0d2" stroke-width="5"/></g>
    <path d="M20 47c4 4 20 4 24 0" stroke="#9fe0d2" stroke-width="1.6" opacity=".8"/>
    <path d="M17 44c3 7 27 7 30 0" stroke="#d4b878" stroke-width="1.4" opacity=".7"/>
    <path d="M22 42l10-8 10 8" stroke="#b89858" stroke-width="2.6"/>
    <path d="M22 32l10-8 10 8" stroke="url(#gold)" stroke-width="2.8"/>
    <path d="M22 22l10-9 10 9" stroke="#fff8e8" stroke-width="3"/>
  </g>

  <!-- CELL 1: hex spirit crystal -->
  <g>
    <g filter="url(#soft)" opacity=".5"><path d="M96 12l16 10v20l-16 10-16-10V22z" fill="#2f7a5c"/></g>
    <path d="M96 12l16 10v20l-16 10-16-10V22z" fill="url(#gemA)"/>
    <path d="M96 12l16 10-16 8-16-8z" fill="url(#gemB)" opacity=".9"/>
    <path d="M96 30v22l-16-10V22z" fill="#123f36" opacity=".75"/>
    <path d="M96 30l16-8v20l-16 10z" fill="#9fe0d2" opacity=".35"/>
    <path d="M96 12l16 10v20l-16 10-16-10V22z" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M80 22l16 8 16-8M96 30v22" fill="none" stroke="#e8c888" stroke-width="1.2" opacity=".9"/>
    <path d="M88 19l8 5" stroke="#fff8e8" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
    <circle cx="96" cy="30" r="2" fill="#fff8e8" filter="url(#soft2)"/>
  </g>

  <!-- CELL 2: jade bi disc + ember -->
  <g>
    <g filter="url(#soft)" opacity=".6"><circle cx="160" cy="38" r="15" fill="#2f7a5c"/></g>
    <circle cx="160" cy="38" r="15" fill="#123f36" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="160" cy="38" r="11.5" fill="none" stroke="#9fe0d2" stroke-width="1" opacity=".7"/>
    <circle cx="160" cy="38" r="5" fill="#06201b" stroke="#e8c888" stroke-width="1.6"/>
    <!-- 回纹 ticks -->
    <g stroke="#d4b878" stroke-width="1.2" opacity=".85">
      <path d="M160 24.5v3M160 48.5v3M146.5 38h3M170.5 38h3"/>
      <path d="M150.5 28.5l2.1 2.1M167.4 45.4l2.1 2.1M169.5 28.5l-2.1 2.1M152.6 45.4l-2.1 2.1"/>
    </g>
    <path d="M155 32a8 8 0 0110-1" fill="none" stroke="#fff8e8" stroke-width="1.2" opacity=".55"/>
    <!-- ember wisp -->
    <g filter="url(#soft2)" opacity=".9">
      <path d="M160 8c3 4 5 6 5 9a5 5 0 01-10 0c0-3 2-5 5-9z" fill="#e8c888"/>
    </g>
    <path d="M160 10c2 3 3.4 4.4 3.4 6.4a3.4 3.4 0 01-6.8 0c0-2 1.4-3.4 3.4-6.4z" fill="#fff8e8"/>
    <circle cx="166" cy="20" r="1.2" fill="#e8c888" opacity=".8"/>
    <circle cx="154" cy="18" r="1" fill="#e8c888" opacity=".7"/>
  </g>

  <!-- CELL 3: treasure chest -->
  <g>
    <path d="M208 30a16 10 0 0132 0z" fill="#0b2e27" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M207 32h34v16a2 2 0 01-2 2h-30a2 2 0 01-2-2z" fill="#123f36" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>
    <rect x="206" y="28.5" width="36" height="4" rx="1.5" fill="url(#gold)"/>
    <g filter="url(#soft)" opacity=".85"><rect x="209" y="26" width="30" height="5" fill="url(#seam)"/></g>
    <path d="M224 20v10M213 24.5l-1 7M235 24.5l1 7" stroke="#d4b878" stroke-width="1.4" opacity=".8"/>
    <rect x="221" y="34" width="6" height="8" rx="1" fill="url(#gold)" stroke="#e8c888" stroke-width="1"/>
    <circle cx="224" cy="37.5" r="1.3" fill="#06201b"/>
    <path d="M211 36v12M237 36v12" stroke="#b89858" stroke-width="1.4" opacity=".85"/>
    <path d="M210 44h28" stroke="#9fe0d2" stroke-width="1" opacity=".35"/>
  </g>

</svg>