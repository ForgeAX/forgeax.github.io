<!-- ===== top-centre crest ===== -->
<g transform="translate(260,0)">
  <g>
    <line x1="12" y1="6" x2="56" y2="6" stroke="url(#gCrestGold)" stroke-width="0.9"/>
    <line x1="13" y1="8" x2="52" y2="8" stroke="url(#gCrestJade)" stroke-width="0.6"/>
    <g transform="translate(51,6) scale(0.8)">
      <path d="M0,-3 C0.4,-1 1,-0.4 3,0 C1,0.4 0.4,1 0,3 C-0.4,1 -1,0.4 -3,0 C-1,-0.4 -0.4,-1 0,-3 Z" fill="#d4b878" opacity="0.6"/>
      <path d="M0,-3 C0.4,-1 1,-0.4 3,0 C1,0.4 0.4,1 0,3 C-0.4,1 -1,0.4 -3,0 C-1,-0.4 -0.4,-1 0,-3 Z" fill="#e8c888" opacity="0.25" filter="url(#fHalo)"/>
    </g>
  </g>
  <g transform="scale(-1,1)">
