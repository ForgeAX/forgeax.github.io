    <polygon points="0,-1.8 1.8,0 0,1.8 -1.8,0" transform="translate(0,98)" fill="#d4b878" opacity="0.55"/>
    <polygon points="0,-1.8 1.8,0 0,1.8 -1.8,0" transform="translate(0,98)" fill="#e8c888" opacity="0.22" filter="url(#fHalo)"/>
