    <polygon points="0,-1.8 1.8,0 0,1.8 -1.8,0" transform="translate(0,98)" fill="#e8c888" opacity="0.22" filter="url(#fHalo)"/>
  </g>
  <g transform="translate(340,0)">
    <line x1="0" y1="56" x2="0" y2="140" stroke="url(#tickFade)" stroke-width="0.8"/>
    <polygon points="0,-1.8 1.8,0 0,1.8 -1.8,0" transform="translate(0,98)" fill="#d4b878" opacity="0.55"/>
    <polygon points="0,-1.8 1.8,0 0,1.8 -1.8,0" transform="translate(0,98)" fill="#e8c888" opacity="0.22" filter="url(#fHalo)"/>
  </g>
  <g transform="translate(420,0)">
    <line x1="0" y1="56" x2="0" y2="140" stroke="url(#tickFade)" stroke-width="0.8"/>
    <polygon points="0,-1.8 1.8,0 0,1.8 -1.8,0" transform="translate(0,98)" fill="#d4b878" opacity="0.55"/>
    <polygon points="0,-1.8 1.8,0 0,1.8 -1.8,0" transform="translate(0,98)" fill="#e8c888" opacity="0.22" filter="url(#fHalo)"/>
  </g>
</g>

<!-- ===== corner L-bracket fragments ===== -->
<g transform="translate(6,14)">
  <line x1="0" y1="0" x2="40" y2="0" stroke="url(#gGoldH)" stroke-width="0.9"/>
  <line x1="0" y1="0" x2="0" y2="40" stroke="url(#gGoldV)" stroke-width="0.9"/>
