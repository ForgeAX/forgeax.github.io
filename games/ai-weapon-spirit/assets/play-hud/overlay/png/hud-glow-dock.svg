  <line x1="0" y1="0" x2="0" y2="40" stroke="url(#gGoldV)" stroke-width="0.9"/>
  <line x1="3" y1="2.5" x2="38" y2="2.5" stroke="url(#gJadeH)" stroke-width="0.6"/>
  <line x1="2.5" y1="3" x2="2.5" y2="38" stroke="url(#gJadeV)" stroke-width="0.6"/>
  <polygon points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="#f3e8d0" opacity="0.22" filter="url(#fHalo)"/>
