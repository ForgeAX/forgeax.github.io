<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="jadeGradient">
      <stop offset="0%" stop-color="#1a4d38" stop-opacity="0.5"/>
      <stop offset="90%" stop-color="#0d2f22" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#03120c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightArcGradient">
      <stop offset="0%" stop-color="#e8c888" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8c888" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurJade" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3"/>
    </filter>
  </defs>
  <!-- Dark jade disc -->
  <circle cx="32" cy="32" r="29" fill="url(#jadeGradient)"/>
  
  <!-- Top light arc -->
  <circle cx="32" cy="20" r="15" fill="url(#lightArcGradient)" opacity="0.25"/>
  
  <!-- 菱花 jewel at top -->
  <g transform="translate(32,12)">
    <circle r="3" fill="#f3e8d0" opacity="0.2" filter="url(#blurJade)"/>
    <polygon points="0,-3 0.75,-0.75 3,0 0.75,0.75 0,3 -0.75,0.75 -3,0 -0.75,-0.75" fill="#e8c888" stroke="#b89858" stroke-width="0.2"/>
    <polygon points="0,-0.75 0.75,0 0,0.75 -0.75,0" fill="#fff8e8"/>
  </g>
</svg>
